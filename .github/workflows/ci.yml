name: Start Continuous Integration

on:
  push: {}

  workflow_dispatch:
    inputs:
      env:
        description: Env mode
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  start_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Source code checkout
        uses: actions/checkout@v4

      - name: Show this commit
        run: |
          echo "Commit ID: ${{ github.sha }}"

      - name: Check Python
        run: |
          set -euo pipefail

          if command -v python >/dev/null 2>&1; then
            echo "Python command available"
            python --version
          else
            echo "Python command not available, instaling...."
            sudo apt update
            sudo apt install python3 python3-pip
          fi

      - name: Call Dependency Abstractor
        run: python scripts/ci/dependency_abstractor.py

      - name: Completion
        run: echo "Successfully completed CI workflow!"
