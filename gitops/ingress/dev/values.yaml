namespace: dev
ingress:
  name: kubapp-dev-alb
  className: alb
  baseDomain: rundailytest.online
  enableSubdomainRouting: true
  certificateArn: arn:aws:acm:us-east-1:259183055744:certificate/fe004942-ae52-4529-9fcb-db58154589c7
  annotations:
    scheme: internet-facing
    targetType: ip
    healthcheckPath: /
    listenPorts:
      - HTTP: 80
      - HTTPS: 443
    group: kubapp-shared
services:
  - name: node-order-app
    enabled: true
    port: 80
  - name: py-cicd-app
    enabled: true
    port: 80
