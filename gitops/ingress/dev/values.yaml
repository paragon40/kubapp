namespace: dev
ingress:
  name: kubapp-dev-alb
  className: alb
  baseDomain: rundailytest.online
  enableSubdomainRouting: true
  certificateArn: arn:aws:acm:us-east-1:532918215760:certificate/3cd3d21d-5e38-4e57-a754-c8e290076b56
  annotations:
    scheme: internet-facing
    targetType: ip
    healthcheckPath: /
    listenPorts:
      - HTTP: 80
      - HTTPS: 443
    group: kubapp-shared
services:
  - name: weather
    enabled: true
    port: 80
  - name: metrics
    enabled: true
    port: 80
  - name: admin
    port: 80
    enabled: true
  - name: urlshortener
    enabled: true
    port: 80
