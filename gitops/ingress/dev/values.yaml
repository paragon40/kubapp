namespace: dev
ingress:
  name: kubapp-dev-alb
  className: alb
  baseDomain: rundailytest.online
  enableSubdomainRouting: true
  certificateArn: arn:aws:acm:us-east-1:259183055744:certificate/01bb6356-a1b5-40ff-8457-605bf5f87df0
  annotations:
    scheme: internet-facing
    targetType: ip
    healthcheckPath: /
    listenPorts:
      - HTTP: 80
      - HTTPS: 443
    group: kubapp-shared
services:
  - name: node-order-app
    enabled: true
    port: 80
  - name: python-cicd
    enabled: true
    port: 80
  - name: py-cicd-app
    enabled: true
    port: 80
